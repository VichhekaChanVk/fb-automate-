[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# The dashboard HTML lives in a string template; its long lines are markup, not code.
"fb_scheduler/app.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
